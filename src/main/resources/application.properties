
spring.application.name=inventory

# Conexion a la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=${DB_CONNECTION_INIT_SQL:}

# Hibernate y zona horaria
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jackson.time-zone=America/Lima

# Servidor y sesiones
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Manejo de errores
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Seguridad de autenticacion
security.login.window-minutes=${SECURITY_LOGIN_WINDOW_MINUTES:15}
security.login.alert-at=${SECURITY_LOGIN_ALERT_AT:3}
security.login.block-at=${SECURITY_LOGIN_BLOCK_AT:5}
security.login.alert-cooldown-minutes=${SECURITY_LOGIN_ALERT_COOLDOWN_MINUTES:15}
security.admin.email=${SECURITY_ADMIN_EMAIL:}
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:}

# Correo mediante Brevo
brevo.api-key=${BREVO_API_KEY:}
mail.from.email=${BREVO_SENDER_EMAIL:}
mail.from.name=${BREVO_SENDER_NAME:LUANY}

# Asistente de inteligencia artificial
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite
